name: Build dynamic offline map

on:
  workflow_dispatch:
    inputs:
      latitude:
        description: Latitude des Kartenmittelpunkts (-85 bis 85)
        required: true
        type: string
      longitude:
        description: Longitude des Kartenmittelpunkts (-180 bis 180)
        required: true
        type: string
      map_name:
        description: Name der Offlinekarte
        required: false
        default: offline-map
        type: string
      protomaps_url:
        description: Optionale feste Protomaps-PMTiles-URL (leer = neuester Daily Build)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: offline-map-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Generate PMTiles and POIs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ARTIFACT_NAME: kajaktracker-offline-map
      MAX_GEOFABRIK_BYTES: '2684354560'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Osmium
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends osmium-tool

      - name: Validate inputs and calculate bounds
        id: area
        env:
          INPUT_LATITUDE: ${{ inputs.latitude }}
          INPUT_LONGITUDE: ${{ inputs.longitude }}
          INPUT_MAP_NAME: ${{ inputs.map_name }}
        run: |
          python3 tools/offline_map_generator.py prepare \
            --latitude "$INPUT_LATITUDE" \
            --longitude "$INPUT_LONGITUDE" \
            --map-name "$INPUT_MAP_NAME" \
            --output work/build-context.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Resolve current basemap and Geofabrik regions
        id: sources
        env:
          INPUT_PROTOMAPS_URL: ${{ inputs.protomaps_url }}
        run: |
          curl --fail --location --retry 4 --retry-delay 5 \
            --output work/protomaps-builds.json \
            https://build-metadata.protomaps.dev/builds.json
          curl --fail --location --retry 4 --retry-delay 5 \
            --output work/geofabrik-index.json \
            https://download.geofabrik.de/index-v1.json
          python3 tools/offline_map_generator.py sources \
            --context work/build-context.json \
            --protomaps-builds work/protomaps-builds.json \
            --protomaps-url "$INPUT_PROTOMAPS_URL" \
            --geofabrik-index work/geofabrik-index.json \
            --regions-tsv work/geofabrik-regions.tsv \
            --output work/source-context.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Extract Protomaps basemap ranges
        env:
          PROTOMAPS_URL: ${{ steps.sources.outputs.protomaps_url }}
        run: |
          mkdir -p artifact work/metrics
          start_time=$(date +%s)
          index=0
          while read -r bounds; do
            docker run --rm --volume "$PWD/artifact:/data" ghcr.io/protomaps/go-pmtiles:latest \
              extract "$PROTOMAPS_URL" "/data/basemap-part-$index.pmtiles" \
              --bbox="$bounds" --minzoom=10 --maxzoom=15 \
              --download-threads=8 --overfetch=0.05 2>&1 | tee -a work/metrics/pmtiles-extract.log
            index=$((index + 1))
          done < <(jq -r '.bboxParts[] | join(",")' work/build-context.json)
          if (( index == 1 )); then
            mv artifact/basemap-part-0.pmtiles artifact/offline-map.pmtiles
          else
            docker run --rm --volume "$PWD/artifact:/data" ghcr.io/protomaps/go-pmtiles:latest \
              merge /data/basemap-part-0.pmtiles /data/basemap-part-1.pmtiles /data/offline-map.pmtiles
            rm artifact/basemap-part-*.pmtiles
          fi
          echo "$(( $(date +%s) - start_time ))" > work/metrics/pmtiles-seconds.txt
          test -s artifact/offline-map.pmtiles

      - name: Download selected Geofabrik extracts
        run: |
          mkdir -p work/geofabrik
          total=0
          index=0
          while IFS=$'\t' read -r region url; do
            target="work/geofabrik/$(printf '%02d' "$index").osm.pbf"
            echo "Downloading Geofabrik region: $region"
            remote_size=$(curl --fail --silent --show-error --location --head "$url" | \
              awk 'tolower($1) == "content-length:" { gsub("\\r", "", $2); size=$2 } END { print size+0 }')
            if (( remote_size == 0 )); then
              echo "Die Größe des Geofabrik-Extrakts $region konnte nicht vorab bestimmt werden." >&2
              echo "Der Download wird zum Schutz vor unpraktisch großen Dateien nicht gestartet." >&2
              exit 1
            fi
            if (( total + remote_size > MAX_GEOFABRIK_BYTES )); then
              echo "Geofabrik-Extrakte würden das Limit von $MAX_GEOFABRIK_BYTES Bytes überschreiten." >&2
              echo "Für diese Position ist derzeit keine praktikable weltweite POI-Erzeugung möglich." >&2
              exit 1
            fi
            curl --fail --location --retry 4 --retry-delay 10 --output "$target" "$url"
            size=$(stat --format=%s "$target")
            total=$((total + size))
            if (( total > MAX_GEOFABRIK_BYTES )); then
              echo "Geofabrik-Extrakte überschreiten das Limit von $MAX_GEOFABRIK_BYTES Bytes." >&2
              echo "Für diese Position ist derzeit keine praktikable weltweite POI-Erzeugung möglich." >&2
              exit 1
            fi
            index=$((index + 1))
          done < work/geofabrik-regions.tsv
          test "$index" -gt 0
          echo "$total" > work/metrics/geofabrik-bytes.txt

      - name: Extract and merge 30 km POI area
        run: |
          mkdir -p work/area-parts
          index=0
          for source in work/geofabrik/*.osm.pbf; do
            while read -r bounds; do
              osmium extract --bbox "$bounds" --strategy complete_ways --overwrite \
                --output "work/area-parts/$(printf '%02d' "$index").osm.pbf" "$source"
              index=$((index + 1))
            done < <(jq -r '.bboxParts[] | join(",")' work/build-context.json)
          done
          if (( index == 1 )); then
            cp work/area-parts/00.osm.pbf work/offline-area.osm.pbf
          else
            osmium merge --overwrite --output work/offline-area.osm.pbf work/area-parts/*.osm.pbf
          fi
          osmium fileinfo --extended work/offline-area.osm.pbf
          test -s work/offline-area.osm.pbf

      - name: Extract compact POI source
        run: |
          osmium tags-filter work/offline-area.osm.pbf \
            nwr/waterway=lock_gate nwr/waterway=lock nwr/lock=yes \
            nwr/waterway=weir \
            nwr/amenity=restaurant nwr/amenity=cafe nwr/amenity=pub \
            nwr/amenity=biergarten nwr/amenity=fast_food nwr/amenity=toilets \
            nwr/tourism=camp_site nwr/tourism=caravan_site \
            nwr/leisure=slipway nwr/canoe=put_in nwr/canoe=launch \
            nwr/waterway=access_point \
            --overwrite --output work/offline-pois.osm.pbf
          osmium export work/offline-pois.osm.pbf --overwrite --output work/offline-pois.geojson
          python3 tools/offline_map_generator.py pois \
            --context work/build-context.json \
            --geojson work/offline-pois.geojson \
            --output artifact/offline-pois.json

      - name: Validate archive and create metadata
        run: |
          python3 tools/offline_map_generator.py finalize \
            --context work/build-context.json \
            --sources work/source-context.json \
            --metrics-dir work/metrics \
            --pmtiles artifact/offline-map.pmtiles \
            --pois artifact/offline-pois.json \
            --metadata artifact/offline-map.json \
            --summary "$GITHUB_STEP_SUMMARY" \
            --artifact-name "$ARTIFACT_NAME"

      - name: Upload offline map artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            artifact/offline-map.pmtiles
            artifact/offline-pois.json
            artifact/offline-map.json
          if-no-files-found: error
          retention-days: 14
