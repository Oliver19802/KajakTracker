<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#56a8b3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="KajakTracker">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIINfQ3P0hYx7nP9x5zFhQ0Q1ZQk9qX9x2U="
        crossorigin="">
  <link rel="stylesheet" href="style.css">
  <title>KajakTracker</title>
</head>
<body>
  <header>
    <div class="title">KajakTracker</div>
    <div id="status" class="status idle">Bereit</div>
  </header>

  <main>
    <section id="map"></section>

    <section class="panel">
      <div id="timer" class="timer">00:00:00</div>

      <div class="stats">
        <div><span>Entfernung</span><strong id="distance">0,00 km</strong></div>
        <div><span>Tempo</span><strong id="speed">0,0 km/h</strong></div>
        <div><span>Ø Tempo</span><strong id="avgSpeed">0,0 km/h</strong></div>
        <div><span>Max</span><strong id="maxSpeed">0,0 km/h</strong></div>
        <div><span>Punkte</span><strong id="points">0</strong></div>
      </div>

      <div class="buttons">
        <button id="startBtn" class="primary">▶ Start</button>
        <button id="pauseBtn" class="pause" disabled>Ⅱ Pause</button>
        <button id="stopBtn" class="danger" disabled>■ Stoppen</button>
      </div>

      <div class="secondaryButtons">
        <button id="locateBtn">◎ Mein Standort</button>
        <button id="exportBtn">⇩ GPX</button>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
