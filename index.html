<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>KajakTracker</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  >

  <!-- Eigene CSS -->
  <link rel="stylesheet" href="style.css">
</head>


<body>

  <header>

    <div class="title">
      KajakTracker
    </div>

    <div
      id="status"
      class="status idle"
    >
      Bereit
    </div>

  </header>


  <main>

    <!-- ==================================================
         KARTE
         ================================================== -->

    <div id="map"></div>


    <!-- ==================================================
         BEDIENFELD
         ================================================== -->

    <section class="panel">

      <!-- Timer -->
      <div
        id="timer"
        class="timer"
      >
        00:00:00
      </div>


      <!-- Statistik -->
      <div class="stats">

        <div>
          <span>Entfernung</span>
          <strong id="distance">
            0,00 km
          </strong>
        </div>


        <div>
          <span>Geschwindigkeit</span>
          <strong id="speed">
            0,0 km/h
          </strong>
        </div>


        <div>
          <span>Ø Tempo</span>
          <strong id="avgSpeed">
            0,0 km/h
          </strong>
        </div>


        <div>
          <span>Max</span>
          <strong id="maxSpeed">
            0,0 km/h
          </strong>
        </div>


        <div>
          <span>Punkte</span>
          <strong id="points">
            0
          </strong>
        </div>

      </div>


      <!-- ==================================================
           HAUPTBUTTONS
           ================================================== -->

      <div class="buttons">

        <button
          id="startBtn"
          class="primary"
        >
          ▶ Start
        </button>


        <button
          id="pauseBtn"
          class="pause"
          disabled
        >
          Ⅱ Pause
        </button>


        <button
          id="stopBtn"
          class="danger"
          disabled
        >
          ■ Stoppen
        </button>

      </div>


      <!-- ==================================================
           ZUSATZBUTTONS
           ================================================== -->

      <div class="secondaryButtons">

        <button id="locateBtn">
          ◎ Mein Standort
        </button>


        <button id="exportBtn">
          ⇩ GPX
        </button>

      </div>

    </section>

  </main>


  <!-- ======================================================
       LEAFLET JAVASCRIPT
       ====================================================== -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin="">
  </script>


  <!-- ======================================================
       EIGENE JAVASCRIPT-DATEI
       ====================================================== -->

  <script src="app.js"></script>

</body>

</html>
