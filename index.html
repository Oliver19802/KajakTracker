<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>KajakTracker</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  >

  <!-- Eigene CSS-Datei -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="title">KajakTracker</div>
    <div id="status" class="status idle">Bereit</div>
  </header>

  <main>

    <!-- Karte -->
    <div id="map"></div>

    <!-- Bedienfeld -->
    <section class="panel">

      <div id="timer" class="timer">00:00:00</div>

      <div class="stats">

        <div>
          <span>Entfernung</span>
          <strong id="distance">0,00 km</strong>
        </div>

        <div>
          <span>Geschwindigkeit</span>
          <strong id="speed">0,0 km/h</strong>
        </div>

        <div>
          <span>Durchschnitt</span>
          <strong id="average">0,0 km/h</strong>
        </div>

        <div>
          <span>Max</span>
          <strong id="maxSpeed">0,0 km/h</strong>
        </div>

        <div>
          <span>Punkte</span>
          <strong id="points">0</strong>
        </div>

      </div>

      <div class="buttons">

        <button id="startBtn" class="primary">
          ▶ Start
        </button>

        <button id="pauseBtn" class="pause" disabled>
         Ⅱ Pause
        </button>

        <button id="stopBtn" class="danger" disabled>
          ■ Stoppen
        </button>

      </div>

      <div class="secondaryButtons">

        <button id="locationBtn">
          ◎ Mein Standort
        </button>

        <button id="gpxBtn">
          ⇩ GPX
        </button>

      </div>

    </section>

  </main>

  <!-- Leaflet JavaScript -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin="">
  </script>

  <!-- Eigene JavaScript-Datei -->
  <script src="app.js"></script>

</body>
</html>
