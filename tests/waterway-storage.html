<!doctype html><meta charset="utf-8"><title>Offline-Wasserwege Speichertest</title>
<h1>Offline-Wasserwege: echter Browserspeicher</h1><button id="run">Speichertests starten</button><pre id="result">Bereit</pre>
<script src="../waterway-offline.js"></script>
<script>
document.getElementById('run').onclick = async () => {
  const output = document.getElementById('result'); output.textContent = '';
  const name = 'kajak-waterways-test-' + crypto.randomUUID();
  const services = [];
  const check = (ok, text) => { if (!ok) throw new Error(text); output.textContent += 'OK: ' + text + '\n'; };
  const bounds = { getSouth:()=>52.1,getNorth:()=>52.11,getWest:()=>13.1,getEast:()=>13.11 };
  const tile = {key:'208:52',elements:[{id:'way/1:0',tags:{waterway:'river',name:'Testfluss'},geometry:[{lat:52.1,lon:13.1},{lat:52.11,lon:13.11}]}]};
  const plain = new TextEncoder().encode(JSON.stringify({tiles:[tile]}));
  const bytes = new Uint8Array(await new Response(new Blob([plain]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
  const hash = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),b=>b.toString(16).padStart(2,'0')).join('');
  const manifest = {schema:1,country:'de',step:.25,version:hash,generatedAt:'2026-09-25T00:00:00Z',bytes:bytes.length,decodedBytes:plain.length,parts:[{file:'de/'+hash+'.json.gz',sha256:hash,bytes:bytes.length,decodedBytes:plain.length,cells:['208:52']}]};
  try {
    const first = new KajakOfflineWaterways(name);services.push(first);await first.ready;
    first.fetchFile = async url => url.endsWith('/de.json') ? new TextEncoder().encode(JSON.stringify(manifest)).buffer : bytes.buffer;
    await first.download('de',()=>{});
    check(first.installed.length===1,'Land wird erst nach vollständigem Download aktiviert');
    const second = new KajakOfflineWaterways(name);services.push(second);await second.ready;
    second.fetchFile = async()=>{throw new Error('Netzwerk darf nicht benutzt werden');};
    check((await second.query(bounds)).elements.length===1,'Nach erneutem Öffnen ohne Netzwerk lesbar');
    const revision = first.installed[0].revision;
    manifest.version='a'.repeat(64);
    first.fetchFile = async url => url.endsWith('/de.json') ? new TextEncoder().encode(JSON.stringify(manifest)).buffer : new Uint8Array(bytes.length).buffer;
    let rejected=false;try{await first.download('de',()=>{});}catch{rejected=true;}
    check(rejected && first.installed[0].revision===revision,'Falsche Prüfsumme lässt altes Paket unverändert');
    check((await first.query(bounds)).elements.length===1,'Altes Paket nach fehlgeschlagenem Update weiter lesbar');
    first.fetchFile = async url => { if(url.endsWith('/de.json'))return new TextEncoder().encode(JSON.stringify(manifest)).buffer;first.controller.abort();return bytes.buffer;};
    rejected=false;try{await first.download('de',()=>{});}catch{rejected=true;}
    check(rejected && first.installed[0].revision===revision,'Abbruch aktiviert kein unvollständiges Paket');
    const replacement=structuredClone(tile);replacement.elements[0].tags.name='Neu';
    const newerPlain=new TextEncoder().encode(JSON.stringify({tiles:[replacement]}));
    const newer=new Uint8Array(await new Response(new Blob([newerPlain]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
    const newerHash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',newer)),b=>b.toString(16).padStart(2,'0')).join('');
    manifest.version=newerHash;manifest.bytes=newer.length;manifest.decodedBytes=newerPlain.length;manifest.parts=[{file:'de/'+newerHash+'.json.gz',sha256:newerHash,bytes:newer.length,decodedBytes:newerPlain.length,cells:['208:52']}];
    first.fetchFile=async url=>url.endsWith('/de.json')?new TextEncoder().encode(JSON.stringify(manifest)).buffer:newer.buffer;
    await first.download('de',()=>{});
    check((await first.query(bounds)).elements[0].tags.name==='Neu','Vollständiges Update ersetzt das alte Paket');
    output.textContent+='ALLE 6 SPEICHERTESTS BESTANDEN';
  } catch(error) { output.textContent+='FEHLER: '+error.stack; }
  finally { for(const service of services)service.db?.close();indexedDB.deleteDatabase(name); }
};
</script>
